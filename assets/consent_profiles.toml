# dsh-web-missions — consent profiles (C10, M5 5.5)
#
# Accept-label vocabulary for deterministic consent-banner handling.
# When a fresh fetch comes back `thin` with a CMP marker, the host runs the
# consent tactic: for each label (up to config `consentMaxAttempts`), ONE
# browser39 invocation tries to accept (element click + accept-link
# navigation, same host session) and re-fetches the page, keeping the
# longest result. Consent adds batch invocations, never budget (D-M5.5).
#
# Design (do NOT grow an endless host list here):
#   1. `generic` is the real product — DE/EN accept vocabulary tried for every
#      host. Prefer extending this list when a new common label shows up.
#   2. `[[hosts]]` is optional priority only: those labels are tried BEFORE
#      generic for that hostname (case-insensitive). Use sparingly for labels
#      that are unique to one site, not to duplicate generic.
#   3. Per-project override: copy this file to
#      `.dsh/web-missions/consent_profiles.toml` — it REPLACES this asset
#      wholesale (no merge). That is how operators add site-specific labels
#      without waiting on a package bump.
#
# Grammar (v0 subset — anything else is consent_profiles_invalid, fail-loud):
#   generic = [ "label", ... ]
#   [[hosts]]
#   host = "example.de"
#   acceptLabels = [ "Accept all", ... ]
#
# Matching is case-insensitive on the trimmed element/link text.

generic = [
  "Accept all",
  "Accept",
  "Alle akzeptieren",
  "Zustimmen",
  "Akzeptieren",
  "Allow all",
  "I agree",
  "Yes, I agree",
  "Agree",
  "Einverstanden",
]

# Optional host priority (unique labels only). Empty by default — use the
# cwd override file for dogfood / one-off sites.
# [[hosts]]
# host = "example.com"
# acceptLabels = ["Got it"]
